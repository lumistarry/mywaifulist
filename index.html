<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="My Waifu List">
<title>My Waifu List</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-head wrap">
  <div class="brand"><i></i> MY WAIFU LIST</div>
  <h1>My Waifu List</h1>
  <details class="about">
    <summary>关于这个列表</summary>
    <div id="intro"></div>
  </details>
  <div class="statline" id="statline"></div>
</header>

<div class="toolbar">
  <div class="bar-inner wrap">
    <label class="search">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="q" type="search" placeholder="搜索角色 / 标签 / IP" autocomplete="off">
      <button id="clear" class="clear" type="button" hidden>×</button>
    </label>
    <button id="theme" class="theme-btn" type="button" title="切换主题">☀</button>
  </div>
  <div class="chips wrap" id="chips"></div>
  <div class="resultline wrap" id="resultline"></div>
</div>

<main id="app" class="wrap"></main>

<footer class="foot wrap">
  数据更新于 <time id="generated"></time>
</footer>

<script src="data/site-data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
